name: Limpar ofertas antigas

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar cleanup-offers
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/cleanup-offers" \
            -H "Content-Type: application/json" \
            -H "X-Cleanup-Secret: ${{ secrets.CLEANUP_SECRET }}" \
            -d '{"days":90}'
